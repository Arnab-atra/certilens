[package]
name = "certilens-gtk"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
gtk4 = { version = "0.11.5", features = ["v4_22"] }
libadwaita = { version = "0.9.2", features = ["v1_9", "gtk_v4_22"] }
certilens-pdf = { path = "../certilens-pdf" }
certilens-verify = { path = "../certilens-verify" }
certilens-core = { path = "../certilens-core" }
poppler = { version = "0.6.0", features = ["render"] }
