name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libcairo2-dev \
            libgdk-pixbuf-2.0-dev \
            libpango1.0-dev \
            libgraphene-1.0-dev \
            libpoppler-glib-dev

      - name: Check GTK installation
        run: |
          pkg-config --modversion gtk4
          pkg-config --modversion gdk4
          pkg-config --modversion libadwaita-1

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose
