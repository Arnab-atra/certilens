[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "certilens"
version = "0.1.0"
description = "Local-first document authenticity and verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
certilens = "certilens.__main__:main"

[tool.maturin]
# Where the Rust bridge crate lives.
manifest-path = "crates/certilens-python/Cargo.toml"
# The native module will be installed as `certilens._certilens`.
module-name = "certilens._certilens"
# The Python sources live here.
python-source = "python"
